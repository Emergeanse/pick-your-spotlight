<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traversée maritime de Marseille à Mouzaïaville, 1856">
  <defs>
    <linearGradient id="sky-traversee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a55"/>
      <stop offset="38%" stop-color="#3a4a6b"/>
      <stop offset="58%" stop-color="#c97b4a"/>
      <stop offset="78%" stop-color="#e8a869"/>
      <stop offset="100%" stop-color="#f2c26b"/>
    </linearGradient>
    <linearGradient id="sea-traversee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b4a5a"/>
      <stop offset="100%" stop-color="#16303c"/>
    </linearGradient>
    <pattern id="hatch-sea" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a6a78" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-mountain" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a1a12" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <pattern id="hatch-sky" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1d2a3a" stroke-width="0.4" opacity="0.08"/>
    </pattern>
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.86  0 0 0 0.06 0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <clipPath id="frame-clip">
      <rect x="18" y="14" width="864" height="372" rx="2"/>
    </clipPath>
  </defs>

  <!-- Parchment base -->
  <rect width="900" height="400" fill="#f5ecd9"/>

  <!-- Scene (clipped inside ornamental frame) -->
  <g clip-path="url(#frame-clip)" filter="url(#paper-grain)">
    <rect width="900" height="400" fill="url(#sky-traversee)"/>
    <rect width="900" height="220" fill="url(#hatch-sky)"/>

    <!-- Setting sun -->
    <circle cx="720" cy="118" r="36" fill="#f6d99a" opacity="0.92"/>
    <circle cx="720" cy="118" r="44" fill="none" stroke="#f2e2c0" stroke-width="1.2" opacity="0.5"/>
    <circle cx="720" cy="118" r="52" fill="none" stroke="#f2e2c0" stroke-width="0.6" opacity="0.25"/>
    <!-- Engraved sun rays -->
    <g stroke="#f2e2c0" stroke-width="0.8" opacity="0.35">
      <line x1="720" y1="58" x2="720" y2="72"/>
      <line x1="720" y1="164" x2="720" y2="178"/>
      <line x1="660" y1="118" x2="674" y2="118"/>
      <line x1="766" y1="118" x2="780" y2="118"/>
      <line x1="678" y1="76" x2="688" y2="86"/>
      <line x1="752" y1="150" x2="762" y2="160"/>
      <line x1="678" y1="160" x2="688" y2="150"/>
      <line x1="752" y1="86" x2="762" y2="76"/>
    </g>

    <!-- Clouds (engraved) -->
    <g fill="none" stroke="#3b2f22" stroke-width="0.9" opacity="0.22">
      <path d="M120,72 Q140,58 162,68 Q178,52 200,66 Q220,58 238,72"/>
      <path d="M380,58 Q398,44 420,56 Q438,42 458,58"/>
      <path d="M560,88 Q578,74 600,86 Q618,72 638,88"/>
    </g>

    <!-- Left coast  Marseille -->
    <path d="M0,198 L28,182 L52,196 L78,174 L104,192 L130,168 L156,188 L182,162 L208,184 L234,170 L260,188 L286,176 L0,176 Z" fill="#1d2a3a" opacity="0.72"/>
    <path d="M0,198 L28,182 L52,196 L78,174 L104,192 L130,168 L156,188 L182,162 L208,184 L234,170 L260,188 L286,176 L0,176 Z" fill="url(#hatch-mountain)"/>
    <!-- Old harbor buildings -->
    <g fill="#2a1a12" opacity="0.65">
      <rect x="48" y="168" width="14" height="18"/>
      <polygon points="45,168 55,156 65,168"/>
      <rect x="72" y="172" width="12" height="14"/>
      <polygon points="69,172 78,162 87,172"/>
      <rect x="98" y="166" width="16" height="20"/>
      <polygon points="95,166 106,152 117,166"/>
      <rect x="128" y="170" width="10" height="16"/>
      <polygon points="125,170 133,160 141,170"/>
    </g>
    <!-- Lighthouse -->
    <rect x="248" y="148" width="6" height="28" fill="#3b2f22" opacity="0.7"/>
    <polygon points="245,148 251,136 257,148" fill="#3b2f22" opacity="0.7"/>
    <circle cx="251" cy="140" r="3" fill="#f2e2c0" opacity="0.8"/>

    <!-- Right coast  Algérie / Atlas -->
    <path d="M900,192 L872,168 L846,186 L820,162 L794,180 L768,156 L742,178 L716,150 L690,172 L664,158 L638,176 L612,164 L586,180 L560,168 L534,182 L508,170 L482,186 L456,174 L430,188 L404,176 L378,190 L352,178 L326,192 L900,192 Z" fill="#2a1a12" opacity="0.58"/>
    <path d="M900,192 L872,168 L846,186 L820,162 L794,180 L768,156 L742,178 L716,150 L690,172 L664,158 L638,176 L612,164 L586,180 L560,168 L534,182 L508,170 L482,186 L456,174 L430,188 L404,176 L378,190 L352,178 L326,192 L900,192 Z" fill="url(#hatch-mountain)"/>
    <!-- Palms -->
    <g stroke="#3b2f22" stroke-width="1" fill="none" opacity="0.55">
      <path d="M780,188 L780,168"/>
      <path d="M780,172 Q770,160 758,166"/>
      <path d="M780,172 Q790,158 802,164"/>
      <path d="M780,176 Q772,166 764,170"/>
      <path d="M780,176 Q788,164 796,168"/>
      <path d="M820,186 L820,168"/>
      <path d="M820,172 Q810,160 798,166"/>
      <path d="M820,172 Q830,158 842,164"/>
    </g>

    <!-- Sea -->
    <rect x="0" y="192" width="900" height="208" fill="url(#sea-traversee)"/>
    <rect x="0" y="192" width="900" height="208" fill="url(#hatch-sea)"/>

    <!-- Wave lines (engraving) -->
    <g fill="none" stroke="#5a7a86" stroke-width="0.8" opacity="0.55">
      <path d="M0,218 Q112,208 225,218 T450,216 T675,220 T900,214"/>
      <path d="M0,242 Q112,232 225,242 T450,240 T675,244 T900,238"/>
      <path d="M0,268 Q112,258 225,268 T450,266 T675,270 T900,264"/>
      <path d="M0,294 Q112,284 225,294 T450,292 T675,296 T900,290"/>
      <path d="M0,320 Q112,310 225,320 T450,318 T675,322 T900,316"/>
      <path d="M0,346 Q112,336 225,346 T450,344 T675,348 T900,342"/>
    </g>

    <!-- Voyage route (cartographic dotted arc) -->
    <path d="M180,210 Q450,140 720,200" fill="none" stroke="#f2e2c0" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.65"/>
    <circle cx="180" cy="210" r="3" fill="#f2e2c0" opacity="0.8"/>
    <circle cx="720" cy="200" r="3" fill="#f2e2c0" opacity="0.8"/>

    <!-- 19th-century sailing ship (brig) -->
    <g transform="translate(430, 228)">
      <!-- Hull -->
      <path d="M-38,18 Q0,28 38,18 L32,32 Q0,38 -32,32 Z" fill="#3b2f22" stroke="#2a1a12" stroke-width="1"/>
      <path d="M-38,18 Q0,28 38,18" fill="none" stroke="#5a3a26" stroke-width="0.8"/>
      <!-- Waterline detail -->
      <path d="M-34,26 Q0,32 34,26" fill="none" stroke="#5a3a26" stroke-width="0.6" opacity="0.6"/>
      <!-- Deck houses -->
      <rect x="-8" y="8" width="16" height="10" fill="#2a1a12" opacity="0.7"/>
      <rect x="-2" y="2" width="4" height="8" fill="#2a1a12" opacity="0.7"/>
      <!-- Masts -->
      <line x1="0" y1="-62" x2="0" y2="18" stroke="#3b2f22" stroke-width="2"/>
      <line x1="-22" y1="-48" x2="-22" y2="16" stroke="#3b2f22" stroke-width="1.6"/>
      <line x1="22" y1="-48" x2="22" y2="16" stroke="#3b2f22" stroke-width="1.6"/>
      <!-- Yards and sails -->
      <line x1="-36" y1="-38" x2="36" y2="-38" stroke="#3b2f22" stroke-width="1.2"/>
      <path d="M-34,-38 L-34,-8 L34,-8 L34,-38 Z" fill="#f2e2c0" opacity="0.75" stroke="#5a3a26" stroke-width="0.8"/>
      <path d="M-34,-8 L-34,-38" fill="none" stroke="#5a3a26" stroke-width="0.5" opacity="0.4"/>
      <path d="M0,-8 L0,-38" fill="none" stroke="#5a3a26" stroke-width="0.5" opacity="0.4"/>
      <path d="M34,-8 L34,-38" fill="none" stroke="#5a3a26" stroke-width="0.5" opacity="0.4"/>
      <line x1="-28" y1="-52" x2="28" y2="-52" stroke="#3b2f22" stroke-width="1"/>
      <path d="M-26,-52 L-26,-42 L26,-42 L26,-52 Z" fill="#f5ecd9" opacity="0.7" stroke="#5a3a26" stroke-width="0.7"/>
      <line x1="-18" y1="-58" x2="18" y2="-58" stroke="#3b2f22" stroke-width="0.8"/>
      <path d="M-16,-58 L-16,-50 L16,-50 L16,-58 Z" fill="#f5ecd9" opacity="0.55" stroke="#5a3a26" stroke-width="0.6"/>
      <!-- Fore and mizzen sails -->
      <path d="M-22,-48 L-22,-18 L-8,-22 L-8,-46 Z" fill="#f2e2c0" opacity="0.65" stroke="#5a3a26" stroke-width="0.7"/>
      <path d="M22,-48 L22,-18 L8,-22 L8,-46 Z" fill="#f2e2c0" opacity="0.65" stroke="#5a3a26" stroke-width="0.7"/>
      <!-- Rigging -->
      <g stroke="#3b2f22" stroke-width="0.5" opacity="0.5" fill="none">
        <line x1="0" y1="-62" x2="-22" y2="-48"/>
        <line x1="0" y1="-62" x2="22" y2="-48"/>
        <line x1="-22" y1="-48" x2="-36" y2="-38"/>
        <line x1="22" y1="-48" x2="36" y2="-38"/>
        <line x1="-22" y1="-48" x2="0" y2="-38"/>
        <line x1="22" y1="-48" x2="0" y2="-38"/>
      </g>
      <!-- Wake -->
      <path d="M-20,34 Q0,40 20,34" fill="none" stroke="#f2e2c0" stroke-width="1" opacity="0.35"/>
      <path d="M-14,38 Q0,44 14,38" fill="none" stroke="#f2e2c0" stroke-width="0.8" opacity="0.25"/>
    </g>

    <!-- Cartographic labels -->
    <text x="72" y="158" font-family="Georgia, 'Palatino Linotype', serif" font-size="11" fill="#f2e2c0" opacity="0.85" letter-spacing="0.08em">MARSEILLE</text>
    <text x="720" y="158" font-family="Georgia, 'Palatino Linotype', serif" font-size="11" fill="#f2e2c0" opacity="0.85" letter-spacing="0.08em">ALGÉRIE</text>
    <text x="620" y="176" font-family="Georgia, 'Palatino Linotype', serif" font-size="9" fill="#f2e2c0" opacity="0.6" font-style="italic">Mouzaïaville</text>

    <!-- Compass rose -->
    <g transform="translate(820, 340)" opacity="0.55">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#f2e2c0" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#f2e2c0" stroke-width="0.5"/>
      <polygon points="0,-14 3,0 0,14 -3,0" fill="#f2e2c0"/>
      <polygon points="0,-14 1.5,-4 0,0 -1.5,-4" fill="#3b2f22" opacity="0.5"/>
      <text x="0" y="-18" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#f2e2c0">N</text>
    </g>
  </g>

  <!-- Ornamental frame -->
  <rect x="14" y="10" width="872" height="380" fill="none" stroke="#3b2f22" stroke-width="2.5" opacity="0.75"/>
  <rect x="18" y="14" width="864" height="372" fill="none" stroke="#5a3a26" stroke-width="0.8" opacity="0.5"/>
  <!-- Corner flourishes -->
  <g stroke="#3b2f22" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M14,10 L14,34 M14,10 L38,10"/>
    <path d="M886,10 L886,34 M886,10 L862,10"/>
    <path d="M14,390 L14,366 M14,390 L38,390"/>
    <path d="M886,390 L886,366 M886,390 L862,390"/>
    <path d="M22,22 Q30,14 38,22"/>
    <path d="M878,22 Q870,14 862,22"/>
    <path d="M22,378 Q30,386 38,378"/>
    <path d="M878,378 Q870,386 862,378"/>
  </g>

  <!-- Year cartouche -->
  <g transform="translate(450, 368)">
    <rect x="-42" y="-14" width="84" height="28" rx="2" fill="#f5ecd9" stroke="#3b2f22" stroke-width="1.2" opacity="0.92"/>
    <rect x="-38" y="-10" width="76" height="20" rx="1" fill="none" stroke="#5a3a26" stroke-width="0.6" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="14" fill="#3b2f22" letter-spacing="0.18em">MDCCCLVI</text>
  </g>
</svg>
