# Genealogie Billeux — static site (no build step)
#
# Netlify Git (recommended):
#   Base directory : docs/genealogie
#   Build command  : (leave empty)
#   Publish directory : .   (or leave empty — defaults to base)
#
# Netlify Drop:
#   Zip or drag-drop THIS ENTIRE FOLDER. All .png files must sit at the
#   root of the upload (not in img/) — nested img/ uploads are dropped by
#   the browser during manual deploy.

[build]
  publish = "."
