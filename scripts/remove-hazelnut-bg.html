<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Remove hazelnut background</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #ccc; display: flex; flex-direction: column; align-items: center; padding: 2rem; gap: 1rem; }
    canvas { border: 1px solid #444; border-radius: 8px; max-width: 320px; }
    button { padding: 10px 24px; background: #7c3aed; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #6d28d9; }
    input[type=range] { width: 240px; }
    label { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h2>🌰 Suppression de fond</h2>
  <p>Glisse la noisette ici ou clique pour charger</p>

  <input type="file" id="fileInput" accept="image/*" />

  <label>
    Tolérance : <span id="tolVal">60</span>
    <input type="range" id="tolerance" min="10" max="120" value="60" />
  </label>
  <label>
    Feather (px) : <span id="featherVal">2</span>
    <input type="range" id="feather" min="0" max="8" value="2" />
  </label>

  <canvas id="canvas"></canvas>
  <button id="download" style="display:none">⬇ Télécharger hazelnut.png</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const tolSlider = document.getElementById("tolerance");
    const featherSlider = document.getElementById("feather");
    const tolVal = document.getElementById("tolVal");
    const featherVal = document.getElementById("featherVal");
    const dlBtn = document.getElementById("download");

    let originalImage = null;

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => { originalImage = img; processImage(); };
      img.src = URL.createObjectURL(file);
    });

    tolSlider.addEventListener("input", () => { tolVal.textContent = tolSlider.value; if (originalImage) processImage(); });
    featherSlider.addEventListener("input", () => { featherVal.textContent = featherSlider.value; if (originalImage) processImage(); });

    function colorDist(r1, g1, b1, r2, g2, b2) {
      return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
    }

    function processImage() {
      if (!originalImage) return;
      canvas.width = originalImage.naturalWidth;
      canvas.height = originalImage.naturalHeight;
      ctx.drawImage(originalImage, 0, 0);

      const tol = parseInt(tolSlider.value);
      const feather = parseInt(featherSlider.value);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const w = canvas.width, h = canvas.height;

      // Sample background color from corners
      const corners = [[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
      let bgR=0, bgG=0, bgB=0;
      corners.forEach(([x,y]) => {
        const i = (y*w+x)*4;
        bgR += data[i]; bgG += data[i+1]; bgB += data[i+2];
      });
      bgR=Math.round(bgR/4); bgG=Math.round(bgG/4); bgB=Math.round(bgB/4);

      // BFS flood fill from corners to find connected background
      const mask = new Uint8Array(w * h); // 0 = foreground, 1 = bg
      const queue = [];
      const push = (x, y) => { const idx = y*w+x; if (!mask[idx]) { mask[idx]=1; queue.push(x,y); } };
      corners.forEach(([x,y]) => push(x,y));

      let qi = 0;
      while (qi < queue.length) {
        const x = queue[qi++], y = queue[qi++];
        const pi = (y*w+x)*4;
        const r=data[pi], g=data[pi+1], b=data[pi+2];
        if (colorDist(r,g,b,bgR,bgG,bgB) > tol) continue;

        for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nx=x+dx, ny=y+dy;
          if (nx>=0 && nx<w && ny>=0 && ny<h) push(nx,ny);
        }
      }

      // Apply transparency + feather
      for (let y=0; y<h; y++) {
        for (let x=0; x<w; x++) {
          const idx = y*w+x;
          if (!mask[idx]) continue;
          const pi = idx*4;
          if (feather <= 0) { data[pi+3]=0; continue; }
          // Find min distance to foreground within feather radius
          let minDist = feather+1;
          for (let fy=-feather; fy<=feather; fy++) {
            for (let fx=-feather; fx<=feather; fx++) {
              const nx=x+fx, ny=y+fy;
              if (nx<0||nx>=w||ny<0||ny>=h) continue;
              if (!mask[ny*w+nx]) { const d=Math.sqrt(fx*fx+fy*fy); if (d<minDist) minDist=d; }
            }
          }
          const alpha = minDist < feather ? Math.round((minDist/feather)*255) : 0;
          data[pi+3] = alpha;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      dlBtn.style.display = "block";
    }

    dlBtn.addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = "hazelnut.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  </script>
</body>
</html>
